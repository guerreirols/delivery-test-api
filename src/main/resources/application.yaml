spring:
  application:
    name: delivery-test

  datasource:
    url: jdbc:sqlite:delivery.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:}
    lifetime: ${JWT_LIFETIME:PT1H}
  refresh:
    lifetime: ${REFRESH_TOKEN_LIFETIME:P7D}
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.deliverytest.api: ${APP_LOG_LEVEL:INFO}
